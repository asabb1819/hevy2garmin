name: Sync Workouts

on:
  schedule:
    # Check four times per hour, offset from peak GitHub Actions traffic.
    # hevy2garmin still uploads only newly completed, unsynced workouts.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-trigger]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install ".[cloud]"
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: hevy2garmin sync
